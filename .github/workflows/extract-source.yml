name: Extract TeamSaaS source
on:
  push:
    branches: [main]
    paths:
      - "payload/part-05.txt"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and extract audited source archive
        run: |
          python - <<'PY'
          import base64, hashlib, io, lzma, pathlib, tarfile
          root = pathlib.Path("payload")
          names = [root / f"part-{i:02d}.txt" for i in range(1, 6)]
          archive = base64.b64decode("".join(p.read_text().strip() for p in names), validate=True)
          expected = "066d110037a0bfc405cf13b9e5d65d611877d4e37b4683b2f57f8495e9be23e2"
          if hashlib.sha256(archive).hexdigest() != expected:
              raise SystemExit("Source archive checksum mismatch")
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(archive)), mode="r:") as tar:
              members = tar.getmembers()
              for member in members:
                  p = pathlib.PurePosixPath(member.name)
                  if p.is_absolute() or ".." in p.parts or not member.isfile():
                      raise SystemExit("Unexpected archive member")
              for member in members:
                  output = pathlib.Path(member.name)
                  output.parent.mkdir(parents=True, exist_ok=True)
                  with tar.extractfile(member) as stream:
                      output.write_bytes(stream.read())
          PY
      - name: Commit and publish application source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app index.py requirements.txt requirements-dev.txt pytest.ini scripts tests .env.example .python-version .gitignore README.md DEPLOYMENT.md
          if ! git diff --cached --quiet; then
            git commit -m "Import full TeamSaaS application source"
            git push origin main
          fi
